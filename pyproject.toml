[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-qa"
version = "0.1.0"
description = "Autonomous Resident Test Engineer System for MESA"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
]

[project.scripts]
mesa-qa = "mesa_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
